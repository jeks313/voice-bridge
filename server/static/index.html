<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voice">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="/static/manifest.json">
<title>Voice</title>
<style>
  :root { color-scheme: dark; --bg: #111318; --card: #1b1e25; --muted: #8b90a0; --accent: #4f7cff; --rec: #e5484d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: #e8eaf0; font: 17px/1.45 -apple-system, system-ui, sans-serif;
         display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: var(--muted); }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  header .dot.ok { background: #3fb950; } header .dot.loading { background: #d29922; }
  header button { margin-left: auto; background: none; border: 1px solid #333846; color: #c8ccd8; border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .me { align-self: flex-end; background: #26344f; padding: 8px 12px; border-radius: 14px 14px 4px 14px; max-width: 85%; }
  .it { align-self: flex-start; background: var(--card); padding: 8px 12px; border-radius: 14px 14px 14px 4px; max-width: 90%; }
  .resume { align-self: stretch; display: flex; align-items: center; gap: 10px; background: #1b2233; border: 1px solid #2c3a5a; border-radius: 12px; padding: 8px 12px; font-size: 14px; color: #b8c4e0; }
  .resume button { margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 600; }
  .old { opacity: .75; }
  .it a { color: #8fb1ff; text-decoration: underline; word-break: break-word; }
  .file { align-self: flex-start; background: #1f2a1f; border: 1px solid #2f4a2f; padding: 8px 12px; border-radius: 12px; font-size: 15px; }
  .meta { align-self: center; font-size: 12px; color: var(--muted); }
  .err { align-self: center; font-size: 14px; color: #ff8a8a; }
  .perm { align-self: stretch; background: #2a2414; border: 1px solid #6b5520; border-radius: 14px; padding: 10px 12px; }
  .perm.risky { background: #2e1616; border-color: #7a2b2b; }
  .perm .what { font-weight: 600; margin-bottom: 4px; } .perm code { display: block; font-size: 13px; color: #d8c79a; white-space: pre-wrap; word-break: break-all; margin: 4px 0 8px; }
  .perm .btns { display: flex; gap: 8px; } .perm button { flex: 1; height: 46px; border-radius: 12px; border: 0; font-size: 17px; font-weight: 600; }
  .perm .ok { background: #2f8f4e; color: #fff; } .perm .no { background: #3a3f4d; color: #fff; } .perm.done { opacity: .55; }
  footer { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  #talk { height: 96px; border-radius: 26px; border: 0; background: var(--accent); color: #fff; font-size: 21px; font-weight: 600; touch-action: manipulation; }
  #talk.rec { background: var(--rec); } #talk.busy { background: #333a4d; color: #aab; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; background: var(--card); border: 1px solid #2c3140; color: inherit; border-radius: 12px; padding: 10px 12px; font-size: 16px; }
  .row #mode { background: #23262e; border-color: #2c3140; color: #6b7080; font-weight: 600; }
  .row #mode.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row button { background: var(--card); border: 1px solid #2c3140; color: inherit; border-radius: 12px; padding: 0 14px; font-size: 15px; }
  header #topicbtn { margin-left: auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header #topicbtn + #newconv { margin-left: 0; }
  #topics { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; padding: env(safe-area-inset-top) 0 0; }
  #topics header { color: #e8eaf0; font-size: 16px; } #tlist { flex: 1; overflow-y: auto; padding: 4px 12px 40px; }
  .topic { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid #2c3140; border-radius: 12px; padding: 12px; margin: 8px 0; }
  .tgroup { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 4px 2px; }
  .topic.active { border-color: var(--accent); } .topic .nm { flex: 1; } .topic .sub { font-size: 13px; color: var(--muted); }
  .topic button { background: none; border: 1px solid #333846; color: #c8ccd8; border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  #viewer { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; padding: env(safe-area-inset-top) 0 0; }
  #viewer header { color: #e8eaf0; } #viewer pre { flex: 1; overflow: auto; margin: 0; padding: 12px 16px 40px; white-space: pre-wrap; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><span id="state">Connecting...</span><button id="topicbtn">Chats</button><button id="newconv">New chat</button></header>
<div id="log"></div>
<footer>
  <div id="activity" style="min-height:1.2em;font-size:13px;color:var(--muted);text-align:center"></div>
  <button id="talk">Tap to talk</button>
  <div class="row"><input id="typed" placeholder="Or type..." enterkeyhint="send"><button id="mode"></button><button id="stop">Stop</button></div>
</footer>
<div id="topics"><header><span>Chats</span><button id="tclose" style="margin-left:auto">Close</button></header><div id="tlist"></div></div>
<div id="viewer"><header><span id="vname"></span><button id="vclose">Close</button></header><pre id="vbody"></pre></div>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
// iOS gives a home-screen app its own storage, so keep ?key= in the URL: Add to Home Screen then saves it too.
if (params.get("key")) localStorage.voiceKey = params.get("key");
let token = localStorage.voiceKey || "";
function askKey() {
  const k = prompt("Pairing key (from ~/Data/voice-bridge/state/pairing-key on spiff):");
  if (k) { localStorage.voiceKey = k.trim(); location.href = "/?key=" + encodeURIComponent(k.trim()); }
}
let tools = {}, historyLoaded = false;
let ws, rec, chunks = [], busy = false, ctx, playing = Promise.resolve(), stopGen = 0, nextIsAudio = false;

// [label](url) and bare http(s) URLs become tappable links; everything else stays plain text
const LINK = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|<?(https?:\/\/[^\s<>)]+[^\s<>).,!?;:'"])>?/g;
function linkify(el, text) {
  let last = 0;
  for (const m of text.matchAll(LINK)) {
    el.append(text.slice(last, m.index));
    const a = document.createElement("a");
    a.href = m[2] || m[3]; a.textContent = m[1] || m[3]; a.target = "_blank"; a.rel = "noopener";
    el.append(a); last = m.index + m[0].length;
  }
  el.append(text.slice(last));
}
function add(cls, text) {
  const d = document.createElement("div"); d.className = cls;
  if (cls === "it") linkify(d, text); else d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
}
function setState(text, cls) { $("state").textContent = text; $("dot").className = "dot " + (cls || ""); }
function setBusy(b) { busy = b; $("talk").classList.toggle("busy", b); $("talk").textContent = b ? "Thinking..." : "Tap to talk"; }

// iOS puts the context in "interrupted" (not "suspended") after a screen lock,
// and sometimes it never comes back; resume any non-running state from a tap,
// and replace the context if it is closed or resume fails.
function audioCtx() {
  if (!ctx || ctx.state === "closed") ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state !== "running") {
    ctx.resume().catch(() => {
      try { ctx.close(); } catch (e) {}
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume().catch(() => {});
    });
  }
  return ctx;
}
// WebKit can also leave a context that reports "running" but plays silence after
// a lock, so throw the context away whenever the page is hidden; the next tap
// (a user gesture) builds a fresh one.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "hidden" || !ctx) return;
  stopAudio();
  try { ctx.close(); } catch (e) {}
  ctx = null;
});
function chime(freq = 880, dur = 0.16) {
  // loud enough to hear outdoors with the phone at arm's length (was 0.08 gain, 80 ms: easy to miss)
  const c = audioCtx(), o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.45, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur);
}
function play(buf) {
  const gen = stopGen;
  playing = playing.then(() => new Promise(async done => {
    if (gen !== stopGen) return done();
    try {
      const c = audioCtx(), b = await c.decodeAudioData(buf), s = c.createBufferSource();
      s.buffer = b; s.connect(c.destination); s.onended = done; s.start();
      window._src = s;
    } catch (e) { add("err", "Audio error: " + e.message); done(); }
  }));
}
function stopAudio() { stopGen++; try { window._src && window._src.stop(); } catch {} playing = Promise.resolve(); }

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { lastSeen = Date.now(); ws.send(JSON.stringify({ type: "hello", token })); };
  ws.onclose = () => { dropped(); setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    lastMsg = lastSeen = Date.now();
    if (typeof ev.data === "string" && ev.data.startsWith('{"type": "pong"')) return;
    if (typeof ev.data !== "string") { if (nextIsAudio) play(ev.data); nextIsAudio = false; return; }
    const m = JSON.parse(ev.data);
    if (m.type === "ready" && pendingUtt) { add("meta", "Resending what you said..."); setBusy(true); lastMsg = Date.now(); sendUtt(); }
    if (m.type === "ready" && !historyLoaded) { historyLoaded = true; ws.send(JSON.stringify({ type: "history" })); ws.send(JSON.stringify({ type: "topics" })); }
    if (m.type === "topics") { showTopics(m.items); return; }
    if (m.type === "fallback") { add("me", m.text); return; }  // the spoken cue that follows says why the chat changed
    if (m.type === "history") {
      $("log").innerHTML = "";
      if (m.items.length) {
        const bar = document.createElement("div"); bar.className = "resume";
        bar.innerHTML = `<span>Picking up where you left off</span><button>New chat</button>`;
        bar.querySelector("button").onclick = newChat;
        $("log").appendChild(bar);
        for (const it of m.items) {
          add(it.role === "me" ? "me" : "it", it.text).classList.add("old");
          for (const f of it.files || []) { const d = add("file", "File: " + f.split("/").slice(-2).join("/")); d.classList.add("old"); d.onclick = () => openFile(f); }
        }
        add("meta", "Earlier turns above · say something to carry on");
      } else add("meta", "New conversation");
      return;
    }
    if (m.type === "ready" || m.type === "status") {
      const t = m.tts || "?";
      setState(t === "ready" ? "Voice ready" : t === "loading" ? "Voice loading (about 15 s)..." : "Voice: " + t,
               t === "ready" ? "ok" : t === "loading" ? "loading" : "");
      if (t === "loading") setTimeout(() => ws.readyState === 1 && ws.send(JSON.stringify({ type: "status" })), 3000);
    } else if (m.type === "transcript") {
      pendingUtt = null;  // the server has it
      add("me", m.text || "(didn't catch that)");
    } else if (m.type === "say") {
      if (!m.replay) add(m.cue ? "meta" : "it", m.text);
      nextIsAudio = m.audio;
    } else if (m.type === "missed") {
      add("it", m.text);
      const bar = document.createElement("div"); bar.className = "resume";
      bar.innerHTML = `<span>You missed this while the phone was away</span><button>Play it</button>`;
      bar.querySelector("button").onclick = () => { audioCtx(); ws.send(JSON.stringify({ type: "replay" })); bar.remove(); };
      $("log").appendChild(bar); $("log").scrollTop = $("log").scrollHeight;
    } else if (m.type === "tool") {
      tools[m.kind] = m.count;
      $("activity").textContent = "Working: " + Object.entries(tools).map(([k, n]) => n > 1 ? `${k} ×${n}` : k).join(" · ");
    } else if (m.type === "file") {
      const d = add("file", "File: " + m.path.split("/").slice(-2).join("/"));
      d.onclick = () => openFile(m.path);
    } else if (m.type === "permission") {
      const d = document.createElement("div"); d.className = "perm" + (m.risky ? " risky" : ""); d.id = "perm-" + m.id;
      d.innerHTML = `<div class="what"></div><code></code><div class="btns"><button class="ok">Approve</button><button class="no">Deny</button></div>`;
      d.querySelector(".what").textContent = (m.risky ? "Needs a tap: " : "") + (m.desc || m.tool);
      d.querySelector("code").textContent = m.detail;
      const answer = a => { ws.send(JSON.stringify({ type: "permission_answer", id: m.id, answer: a })); d.querySelectorAll("button").forEach(b => b.disabled = true); };
      d.querySelector(".ok").onclick = () => answer("approve"); d.querySelector(".no").onclick = () => answer("deny");
      $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
      setBusy(false); $("talk").textContent = "Answer: tap to talk"; relisten();
    } else if (m.type === "permission_done") {
      const d = $("perm-" + m.id);
      if (d) { d.classList.add("done"); d.querySelector(".btns").textContent = m.answer === "approve" ? "Approved" : m.answer === "deny" ? "Denied" : "Left for the desk"; }
      setBusy(true);
    } else if (m.type === "turn_done") {
      setBusy(false); tools = {}; $("activity").textContent = "";
      if (!m.empty) relisten(); else autoArmed = false;  // nothing heard: stop the loop until the next tap
      const t = m.timing || {};
      if (t.first_audio !== undefined) add("meta", `heard ${t.transcript ?? "-"}s · first words ${t.first_token ?? "-"}s · first audio ${t.first_audio}s`);
    } else if (m.type === "error") {
      add("err", m.text); setBusy(false);
      if (m.text === "bad token") { ws.onclose = null; askKey(); }
    }
  };
}
async function openFile(path) {
  const r = await fetch(`/api/file?path=${encodeURIComponent(path)}&token=${encodeURIComponent(token)}`);
  $("vname").textContent = path.split("/").pop(); $("vbody").textContent = r.ok ? await r.text() : "Can't open " + path;
  $("viewer").style.display = "flex";
}
$("vclose").onclick = () => $("viewer").style.display = "none";

// Auto mode: a pause ends the utterance and sends it, and the mic reopens after each reply.
// Manual mode: tap to start, tap to send. A tap always sends straight away in either mode.
let autoMode = localStorage.voiceMode !== "manual", autoArmed = false, vad = null;
const SILENCE_MS = 2000, NO_SPEECH_MS = 8000, MAX_UTT_MS = 60000;
let wake = null;
async function updateWake() {
  const want = document.visibilityState === "visible" && ((autoMode && autoArmed) || busy || !!rec);
  try {
    if (want && !wake && navigator.wakeLock) {
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    } else if (!want && wake) { const w = wake; wake = null; await w.release(); }
  } catch (e) { wake = null; }
}
setInterval(updateWake, 2000);  // cheap, and catches every state change without hooks everywhere
document.addEventListener("visibilitychange", updateWake);
function showMode() { $("mode").textContent = "Auto send"; $("mode").classList.toggle("on", autoMode); }
$("mode").onclick = () => { autoMode = !autoMode; localStorage.voiceMode = autoMode ? "auto" : "manual"; if (!autoMode) autoArmed = false; showMode(); };
showMode();

async function relisten() {
  if (!autoMode || !autoArmed) return;
  let p;
  do { p = playing; await p; } while (p !== playing);  // wait for the whole reply to finish playing
  await new Promise(r => setTimeout(r, 250));
  if (!autoMode || !autoArmed || busy || rec || document.visibilityState !== "visible") return;
  startRec().catch(e => { autoArmed = false; add("err", "Mic: " + e.message + " (tap to talk)"); });
}
function stopRec(send) {
  if (!rec) return;
  if (vad) { clearInterval(vad); vad = null; }
  rec.cancelled = !send;
  $("talk").classList.remove("rec");
  if (rec.state === "inactive") { rec = null; $("talk").textContent = "Tap to talk"; return; }  // iOS killed it
  try { rec.stop(); } catch (e) { rec = null; $("talk").textContent = "Tap to talk"; }
}
function watchSilence(stream) {
  // energy-based end of speech: calibrate on the first 300 ms, then wait for speech followed by a pause
  const c = audioCtx(), src = c.createMediaStreamSource(stream), an = c.createAnalyser();
  an.fftSize = 1024; src.connect(an);
  const buf = new Float32Array(an.fftSize), t0 = Date.now();
  let floor = 0, n = 0, spoke = false, loudMs = 0, quietSince = null;
  vad = setInterval(() => {
    an.getFloatTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length), now = Date.now();
    if (now - t0 < 300) { floor += rms; n++; return; }
    const thr = Math.max((floor / Math.max(n, 1)) * 3, 0.012);
    if (rms > thr) { loudMs += 50; quietSince = null; if (loudMs >= 250) spoke = true; }
    else { loudMs = Math.max(0, loudMs - 25); quietSince = quietSince || now; }
    if (spoke && quietSince && now - quietSince > SILENCE_MS) stopRec(true);
    else if (now - t0 > MAX_UTT_MS) stopRec(true);  // wind or traffic can hide every pause: send anyway
    else if (!spoke && now - t0 > NO_SPEECH_MS) { autoArmed = false; stopRec(false); add("meta", "Didn't hear anything; tap to talk"); }
  }, 50);
}
let starting = false;
async function startRec() {
  if (starting) return;
  audioCtx(); stopAudio();
  starting = true;
  let stream;
  try {
    // iOS can leave getUserMedia hanging forever after an audio interruption: give up after 5 s
    stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }),
      new Promise((_, no) => setTimeout(() => no(new Error("the microphone didn't start; tap to try again")), 5000)),
    ]);
  } finally { starting = false; }
  // the system can take the mic away mid-recording (a call, Siri): send what we have
  stream.getAudioTracks().forEach(t => t.onended = () => stopRec(true));
  const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
  chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const cancelled = rec.cancelled;
    const blob = new Blob(chunks, { type: rec.mimeType || "audio/mp4" }); rec = null;
    $("talk").textContent = "Tap to talk";
    if (cancelled || !connected()) return;
    chime(660); setBusy(true); lastMsg = Date.now();
    pendingUtt = { mime: blob.type, buf: await blob.arrayBuffer() };
    sendUtt();
  };
  rec.start(); chime(880);
  if (autoMode) watchSilence(stream);
  $("talk").classList.add("rec");
  $("talk").textContent = autoMode ? "Listening... pause to send, or tap" : "Listening... tap to send";
}
$("talk").onclick = () => {
  if (busy) return;
  if (rec && rec.state === "inactive") rec = null;  // a recorder iOS stopped behind our back
  if (rec) stopRec(true);
  else { autoArmed = autoMode; startRec().catch(e => add("err", "Mic: " + e.message)); }
};
// a hidden page can't hold the mic: drop any open recording and stop the loop
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { autoArmed = false; stopRec(false); }
});
// Walking off Wi-Fi leaves a socket that looks open but delivers nothing. Ping every 5 s; if nothing
// comes back for 15 s, drop it and reconnect, and resend an utterance the server never acknowledged.
let lastSeen = Date.now(), pendingUtt = null;
function sendUtt() {
  if (!pendingUtt || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: "utterance", mime: pendingUtt.mime }));
  ws.send(pendingUtt.buf);
}
function dropped() {
  setState("Reconnecting...", "");
  if (busy) {
    setBusy(false);
    add("err", pendingUtt ? "Connection dropped; I'll resend what you said." : "Connection dropped; that turn may not have arrived.");
  }
}
setInterval(() => {
  if (!ws || ws.readyState !== 1) return;
  if (Date.now() - lastSeen > 15000) {
    const old = ws; old.onclose = null; old.onmessage = null;
    try { old.close(); } catch (e) {}
    dropped(); connect(); return;
  }
  ws.send(JSON.stringify({ type: "ping" }));
}, 5000);
function connected() {
  if (ws && ws.readyState === 1) return true;
  add("err", "Not connected yet, try again in a moment."); return false;
}
// a turn that goes silent for two minutes releases the button instead of sticking on "Thinking..."
let lastMsg = Date.now();
setInterval(() => { if (busy && Date.now() - lastMsg > 120000) { setBusy(false); add("err", "No reply for two minutes; the button is free again."); } }, 5000);
$("typed").onkeydown = e => {
  if (e.key !== "Enter" || !e.target.value.trim() || busy || !connected()) return;
  audioCtx(); stopAudio();
  add("me", e.target.value); ws.send(JSON.stringify({ type: "text", text: e.target.value })); e.target.value = ""; setBusy(true); lastMsg = Date.now();
};
$("stop").onclick = () => { autoArmed = false; stopRec(false); stopAudio(); };
let topicList = [];
function ago(t) {
  if (!t) return "never";
  const s = Date.now() / 1000 - t;
  return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago";
}
function showTopics(items) {
  topicList = items || [];
  const cur = topicList.find(t => t.active);
  $("topicbtn").textContent = cur ? cur.name : "Chats";
  $("tlist").innerHTML = "";
  let group = null;
  for (const t of topicList) {
    if (t.group !== group) {
      group = t.group;
      const h = document.createElement("div"); h.className = "tgroup";
      h.textContent = group === "voice" ? "Voice chats" : "Other herdr sessions";
      $("tlist").appendChild(h);
    }
    const d = document.createElement("div"); d.className = "topic" + (t.active ? " active" : "");
    d.innerHTML = `<div class="nm"><div></div><div class="sub"></div></div>` + (t.group === "voice" ? `<button>Rename</button>` : "");
    d.querySelector(".nm div").textContent = t.name;
    d.querySelector(".sub").textContent = (t.group !== "voice" ? t.workspace + " · " : "") +
      (t.status === "working" ? "working · " : t.status === "blocked" ? "needs input · " : "") + ago(t.last);
    d.querySelector(".nm").onclick = () => switchTopic(t);
    const rb = d.querySelector("button");
    if (rb) rb.onclick = () => {
      const n = prompt("Rename chat", t.name);
      if (n && n.trim()) ws.send(JSON.stringify({ type: "rename_topic", id: t.id, name: n.trim() }));
    };
    $("tlist").appendChild(d);
  }
}
function switchTopic(t) {
  $("topics").style.display = "none";
  if (t.active || busy || !connected()) return;
  stopAudio(); $("log").innerHTML = ""; add("meta", "Switching to " + t.name + "...");
  ws.send(JSON.stringify({ type: "switch_topic", id: t.id }));
}
function newChat() {
  if (busy || !connected()) return;
  if (!topicList.length) {  // single-session backend: start over in place
    $("log").innerHTML = ""; add("meta", "Starting a new conversation...");
    ws.send(JSON.stringify({ type: "new_conversation" }));
    historyLoaded = false;  // the next "ready" reloads the (now empty) history
    return;
  }
  const name = prompt("Name the new chat (or leave blank and it's named from what you say first)", "");
  if (name === null) return;
  $("topics").style.display = "none";
  stopAudio(); $("log").innerHTML = ""; add("meta", "Starting a new chat (about 10 s)...");
  ws.send(JSON.stringify({ type: "new_topic", name }));
}
$("topicbtn").onclick = () => { if (connected()) ws.send(JSON.stringify({ type: "topics" })); $("topics").style.display = "flex"; };
$("tclose").onclick = () => $("topics").style.display = "none";
$("newconv").onclick = newChat;
connect();
</script>
</body>
</html>
